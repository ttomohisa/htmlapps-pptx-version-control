name: Renderer 1.4 candidate build (temporary)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Synchronize lockfile against npm registry
        shell: pwsh
        run: ./scripts/sync-dependency-lock.ps1 -ForceDownload
      - name: Build standalone HTML with the new renderer
        shell: pwsh
        run: ./build-standalone.ps1
      - name: Verify renderer bundle
        run: node test/renderer-foundation-regression.mjs
      - name: Report checked-in file candidates
        run: node .github/scripts/print-renderer-upgrade.cjs
